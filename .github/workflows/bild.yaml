name: Build Custom Arch ISO

on:
  workflow_dispatch:  # запуск вручную по кнопке в разделе Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (so we have a workspace)
        uses: actions/checkout@v4

      - name: Prepare custom packages list
        run: |
          mkdir -p iso-build
          cat > iso-build/extra-packages.x86_64 << 'EOF'
          mate-desktop
          mate-panel
          mate-session-manager
          mate-settings-daemon
          mate-control-center
          mate-terminal
          marco
          caja
          nemo
          fish
          featherpad
          kwrite
          strawberry
          parcellite
          zathura
          zathura-pdf-mupdf
          rofi
          rofimoji
          xarchiver
          kdeconnect
          networkmanager
          nano
          pacman-contrib
          EOF

      - name: Build ISO inside privileged Arch container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm archlinux-keyring &&
              pacman -Syu --noconfirm &&
              pacman -S --noconfirm archiso git &&
              git clone https://gitlab.archlinux.org/archlinux/archiso.git /tmp/archiso &&
              cat /workspace/iso-build/extra-packages.x86_64 >> /tmp/archiso/configs/releng/packages.x86_64 &&
              mkdir -p /tmp/archiso/configs/releng/airootfs/var/cache/pacman/pkg &&
              pacman -Syw --cachedir=/tmp/archiso/configs/releng/airootfs/var/cache/pacman/pkg --noconfirm \$(cat /tmp/archiso/configs/releng/packages.x86_64) &&
              mkarchiso -v -o /workspace/output /tmp/archiso/configs/releng
            "

      - name: Upload built ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisaonakay-arch-iso
          path: output/*.iso
