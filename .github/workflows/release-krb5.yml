name: Release - mit-krb5 files for Throne (offline unpack in step 3)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag with rootfs-slim.tar.zst'
        required: true
        default: 'rootfs-2026-11-07'

permissions:
  contents: write

jobs:
  krb5:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download and unpack rootfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" -p 'rootfs-slim.tar.zst*'
          sha256sum -c rootfs-slim.tar.zst.sha256
          sudo mkdir -p /mnt/gentoo
          sudo tar -xpf rootfs-slim.tar.zst -I 'zstd -d --long=27' --xattrs-include='*.*' --numeric-owner -C /mnt/gentoo
          rm rootfs-slim.tar.zst

      - name: Prepare chroot mounts
        run: |
          sudo rm -f /mnt/gentoo/etc/resolv.conf
          sudo cp --dereference /etc/resolv.conf /mnt/gentoo/etc/resolv.conf
          sudo mount --types proc /proc /mnt/gentoo/proc
          sudo mount --rbind /sys /mnt/gentoo/sys
          sudo mount --make-rslave /mnt/gentoo/sys
          sudo mount --rbind /dev /mnt/gentoo/dev
          sudo mount --make-rslave /mnt/gentoo/dev

      # the rootfs's own make.conf and profile, so the packages match the installed system
      - name: Install mit-krb5 and pack its files
        run: |
          sudo chroot /mnt/gentoo /bin/bash -c "cd /var/db/pkg && ls -d */* | sort > /root/before.txt"
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            emerge-webrsync --quiet
            eselect profile show
            emerge --oneshot --quiet-build --getbinpkg --usepkg app-crypt/mit-krb5
          "
          # runtime packages that were not in the release (yasm is build-only and stays out)
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            cd /var/db/pkg
            ls -d */* | sort | comm -13 /root/before.txt - | grep -v '^dev-lang/yasm' | tee /root/new.txt
            grep -q '^app-crypt/mit-krb5' /root/new.txt
            for p in \$(cat /root/new.txt); do awk '\$1==\"obj\" || \$1==\"sym\" {print \$2}' \$p/CONTENTS; done | sed 's|^/||' > /root/files.txt
            wc -l /root/files.txt
            tar -C / --numeric-owner -cf - -T /root/files.txt | zstd -19 -q > /root/krb5-files.tar.zst
          "
          sudo mv /mnt/gentoo/root/krb5-files.tar.zst .
          sudo chown "$USER" krb5-files.tar.zst
          zstd -dc krb5-files.tar.zst | tar -t | grep -E 'libgssapi|libverto|libev\.' 
          ls -l krb5-files.tar.zst
          sha256sum krb5-files.tar.zst | tee krb5-files.tar.zst.sha256

      # back to the state of the release, then the guide's step 3: no Portage tree, no network
      - name: Test step 3 (offline unpack) and step 6 (emerge over it)
        run: |
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            emerge --unmerge --quiet \$(sed 's/^/=/' /root/new.txt)
            ! test -e /usr/lib64/libgssapi_krb5.so.2
          "
          sudo mv /mnt/gentoo/var/db/repos/gentoo repo-saved
          sudo cp krb5-files.tar.zst /mnt/gentoo/root/
          sudo unshare --net chroot /mnt/gentoo /bin/bash -c "
            set -e
            tar -xpf /root/krb5-files.tar.zst -I zstd -C /
            ldd /usr/lib64/libgssapi_krb5.so.2
            ! ldd /usr/lib64/libgssapi_krb5.so.2 | grep 'not found'
          "
          echo "✅ step 3: offline unpack works" >> "$GITHUB_STEP_SUMMARY"
          sudo mv repo-saved /mnt/gentoo/var/db/repos/gentoo
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            emerge --oneshot --quiet-build --getbinpkg --usepkg app-crypt/mit-krb5
            qfile /usr/lib64/libgssapi_krb5.so.2 2>/dev/null || grep -l libgssapi_krb5 /var/db/pkg/app-crypt/mit-krb5-*/CONTENTS
          "
          echo "✅ step 6: emerge over the unpacked files works" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber krb5-files.tar.zst krb5-files.tar.zst.sha256
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[]|"\(.name) \(.size)"'
