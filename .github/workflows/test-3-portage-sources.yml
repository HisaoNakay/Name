name: Test 4 - Kernel build (defconfig)

on:
  workflow_dispatch:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo (for make.conf)
        uses: actions/checkout@v4

      - name: Find latest stage3 (amd64-systemd)
        id: find
        run: |
          BASE=https://distfiles.gentoo.org/releases/amd64/autobuilds
          PATH_LINE=$(curl -fsSL "$BASE/latest-stage3-amd64-systemd.txt" | grep -E '\.tar\.xz' | head -1 | cut -d' ' -f1)
          echo "Found: $PATH_LINE"
          test -n "$PATH_LINE"
          echo "url=$BASE/$PATH_LINE" >> "$GITHUB_OUTPUT"

      - name: Download and extract stage3
        run: |
          curl -fL --retry 3 -o stage3.tar.xz "${{ steps.find.outputs.url }}"
          sudo mkdir -p /mnt/gentoo
          sudo tar xpf stage3.tar.xz -C /mnt/gentoo --xattrs-include='*.*' --numeric-owner

      - name: Prepare chroot mounts
        run: |
          sudo cp --dereference /etc/resolv.conf /mnt/gentoo/etc/
          sudo mount --types proc /proc /mnt/gentoo/proc
          sudo mount --rbind /sys /mnt/gentoo/sys
          sudo mount --make-rslave /mnt/gentoo/sys
          sudo mount --rbind /dev /mnt/gentoo/dev
          sudo mount --make-rslave /mnt/gentoo/dev

      - name: Install make.conf, sync Portage, install gentoo-sources
        run: |
          sudo cp make.conf /mnt/gentoo/etc/portage/make.conf
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            emerge-webrsync
            emerge --quiet-build gentoo-sources
            eselect kernel set 1
            ls -l /usr/src/
          "

      - name: Look for CPU-specific options in this kernel's Kconfig
        run: |
          sudo chroot /mnt/gentoo /bin/bash -c "
            cd /usr/src/linux
            echo '--- Piledriver / Bulldozer / K10 options in Kconfig.cpu ---'
            grep -nE 'PILEDRIVER|BULLDOZER|MK10|STEAMROLLER' arch/x86/Kconfig.cpu || echo '(none found)'
          "

      - name: Configure kernel (defconfig, BTF off)
        run: |
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            cd /usr/src/linux
            make defconfig
            scripts/config -d DEBUG_INFO_BTF
            make olddefconfig
            echo '--- CPU-related options in resulting .config ---'
            grep -E '^CONFIG_(GENERIC_CPU|MK8|MK10|M[A-Z0-9]+|X86_64_VERSION|X86_NATIVE_CPU)=' .config || true
            grep -E 'DEBUG_INFO_BTF' .config || true
          "

      - name: Build kernel (timed)
        run: |
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            cd /usr/src/linux
            time make -j4
            ls -lh arch/x86/boot/bzImage
          "

      - name: Collect artifacts
        run: |
          mkdir -p out
          sudo cp /mnt/gentoo/usr/src/linux/arch/x86/boot/bzImage out/
          sudo cp /mnt/gentoo/usr/src/linux/.config out/config-defconfig
          sudo cp /mnt/gentoo/usr/src/linux/System.map out/
          sudo chown -R runner:runner out
          ls -lh out

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hp-defconfig
          path: out/
