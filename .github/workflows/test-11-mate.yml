name: Test 11 - Stage 5, Xorg + MATE + LightDM, boot to desktop in QEMU/UEFI

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the successful Test 8 run (holds the rootfs artifact)'
        required: true
        default: '42297426654'
      artifact_name:
        description: 'Rootfs artifact name'
        required: true
        default: 'rootfs-hp-network'

permissions:
  contents: read
  actions: read

jobs:
  mate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Checkout repo (make.conf, restore/)
        uses: actions/checkout@v4

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rootfs

      # same cache as Test 9: everything built here is reused by the next runs
      - name: Restore Portage cache (binpkgs + distfiles)
        uses: actions/cache/restore@v4
        with:
          path: |
            binpkgs
            distfiles
          key: gentoo-hp-pkgcache-${{ github.run_id }}
          restore-keys: |
            gentoo-hp-pkgcache-

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf parted dosfstools e2fsprogs zstd socat
          mkdir -p binpkgs distfiles shots
          echo "--- restored cache ---"
          du -sh binpkgs distfiles

      - name: Create disk image (GPT, ESP 512MiB FAT32, root ext4)
        run: |
          truncate -s 20G disk.img
          LOOP=$(sudo losetup -fP --show disk.img)
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sudo parted -s "$LOOP" mklabel gpt \
            mkpart ESP fat32 1MiB 513MiB set 1 esp on \
            mkpart root ext4 513MiB 100%
          sudo partprobe "$LOOP" || true
          sudo udevadm settle || true
          sudo mkfs.vfat -F32 "${LOOP}p1"
          sudo mkfs.ext4 -F -L gentoo-root "${LOOP}p2"
          sudo mkdir -p /mnt/gentoo
          sudo mount "${LOOP}p2" /mnt/gentoo
          sudo mkdir -p /mnt/gentoo/efi
          sudo mount "${LOOP}p1" /mnt/gentoo/efi
          lsblk -f "$LOOP"

      - name: Extract rootfs onto the image
        run: |
          ls -lh rootfs/
          sudo tar -xpf rootfs/rootfs.tar.zst -I zstd -C /mnt/gentoo --xattrs-include='*.*' --numeric-owner --exclude='./efi/*'
          rm -rf rootfs
          ls /mnt/gentoo/lib/modules
          df -h /mnt/gentoo

      - name: Prepare chroot mounts
        run: |
          sudo rm -f /mnt/gentoo/etc/resolv.conf
          sudo cp --dereference /etc/resolv.conf /mnt/gentoo/etc/resolv.conf
          sudo mount --types proc /proc /mnt/gentoo/proc
          sudo mount --rbind /sys /mnt/gentoo/sys
          sudo mount --make-rslave /mnt/gentoo/sys
          sudo mount --rbind /dev /mnt/gentoo/dev
          sudo mount --make-rslave /mnt/gentoo/dev
          sudo mkdir -p /mnt/gentoo/var/cache/binpkgs /mnt/gentoo/var/cache/distfiles
          sudo mount --bind "$PWD/binpkgs" /mnt/gentoo/var/cache/binpkgs
          sudo mount --bind "$PWD/distfiles" /mnt/gentoo/var/cache/distfiles

      # restore/package.* are the same files install.sh copies, so the image and a restored system agree
      - name: make.conf, restore package.* files, desktop profile, Portage sync
        run: |
          sudo cp make.conf /mnt/gentoo/etc/portage/make.conf
          sudo sed -i 's/^COMMON_FLAGS=.*/COMMON_FLAGS="-O2 -pipe"/' /mnt/gentoo/etc/portage/make.conf
          printf '\n# CI: keep every built package and reuse it on the next run\nFEATURES="${FEATURES} buildpkg"\nEMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --usepkg"\n' | sudo tee -a /mnt/gentoo/etc/portage/make.conf > /dev/null
          grep -E '^(USE|VIDEO_CARDS|INPUT_DEVICES|COMMON_FLAGS)=' /mnt/gentoo/etc/portage/make.conf
          for t in package.use package.license package.accept_keywords; do
            sudo mkdir -p "/mnt/gentoo/etc/portage/$t"
            sudo cp "restore/$t" "/mnt/gentoo/etc/portage/$t/restore"
          done
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            chown portage:portage /var/cache/binpkgs /var/cache/distfiles
            emerge-webrsync --quiet
            eselect profile set default/linux/amd64/23.0/desktop/systemd
            eselect profile show
          "

      - name: Emerge Xorg + MATE + LightDM (binhost first, the rest built here)
        timeout-minutes: 290
        run: |
          PKGS="x11-base/xorg-server x11-base/xorg-drivers mate-base/mate x11-misc/lightdm x11-misc/lightdm-gtk-greeter media-fonts/dejavu"
          OPTS="--update --deep --newuse --getbinpkg --usepkg"
          sudo chroot /mnt/gentoo /bin/bash -c "emerge --pretend --quiet $OPTS @world $PKGS" > plan.txt 2>&1 || { tail -n 60 plan.txt; exit 1; }
          BIN=$(grep -c '^\[binary' plan.txt || true)
          SRC=$(grep -c '^\[ebuild' plan.txt || true)
          echo "binary: $BIN, from source: $SRC"
          grep '^\[ebuild' plan.txt || true
          START=$(date +%s)
          rc=0
          sudo chroot /mnt/gentoo /bin/bash -c "emerge --quiet-build --keep-going $OPTS @world $PKGS" || rc=$?
          TOOK=$(( ($(date +%s) - START) / 60 ))
          {
            echo "### Test 11: Xorg + MATE"
            echo "- binary packages (binhost/cache): **$BIN**"
            echo "- built from source: **$SRC**"
            echo "- emerge time: **${TOOK} min**, rc=$rc"
            echo '<details><summary>built from source</summary>'
            echo
            echo '```'
            grep '^\[ebuild' plan.txt || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || { echo "❌ emerge failed (rc=$rc)"; exit 1; }

      - name: Configure the desktop (LightDM, graphical target, locale, keyboard)
        run: |
          sudo mkdir -p /mnt/gentoo/etc/X11/xorg.conf.d
          sudo tee /mnt/gentoo/etc/X11/xorg.conf.d/00-keyboard.conf > /dev/null << 'KB_EOF'
          Section "InputClass"
              Identifier "system-keyboard"
              MatchIsKeyboard "on"
              Option "XkbLayout" "us,ru"
              Option "XkbOptions" "grp:win_space_toggle"
          EndSection
          KB_EOF
          sudo sed -i 's/^#\? *user-session=.*/user-session=mate/' /mnt/gentoo/etc/lightdm/lightdm.conf
          grep -n '^user-session' /mnt/gentoo/etc/lightdm/lightdm.conf || true
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            grep -q '^ru_RU.UTF-8' /etc/locale.gen || echo 'ru_RU.UTF-8 UTF-8' >> /etc/locale.gen
            grep -q '^en_US.UTF-8' /etc/locale.gen || echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
            locale-gen
            echo 'LANG=ru_RU.UTF-8' > /etc/locale.conf
            systemctl enable lightdm.service
            systemctl set-default graphical.target
            ls /usr/share/xsessions/
          "

      - name: Release chroot mounts, restore resolv.conf symlink
        if: always()
        run: |
          for m in var/cache/binpkgs var/cache/distfiles dev sys proc; do
            sudo umount -R "/mnt/gentoo/$m" || sudo umount -l -R "/mnt/gentoo/$m" || true
          done
          sudo ln -sf ../run/systemd/resolve/stub-resolv.conf /mnt/gentoo/etc/resolv.conf
          sudo chown -R "$USER" binpkgs distfiles
          du -sh binpkgs distfiles

      # saved even if emerge failed, so long builds are never lost
      - name: Save Portage cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            binpkgs
            distfiles
          key: gentoo-hp-pkgcache-${{ github.run_id }}

      - name: Save rootfs as tar.zst
        run: |
          sync
          sudo tar --xattrs --xattrs-include='*.*' --numeric-owner -I 'zstd -T0 -10' \
            -cpf rootfs.tar.zst -C /mnt/gentoo \
            --exclude='./var/db/repos/gentoo/*' \
            --exclude='./var/cache/distfiles/*' \
            --exclude='./var/cache/binpkgs/*' \
            --exclude='./var/tmp/portage/*' \
            --exclude='./efi/*' \
            --exclude='./proc/*' --exclude='./sys/*' --exclude='./dev/*' --exclude='./run/*' \
            .
          sudo chown "$USER" rootfs.tar.zst
          ls -lh rootfs.tar.zst
          echo "- rootfs-hp-mate: **$(du -h rootfs.tar.zst | cut -f1)**, on disk: **$(sudo du -sh --exclude=./var/db/repos /mnt/gentoo | cut -f1)**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-hp-mate
          path: rootfs.tar.zst
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Regenerate fstab, reinstall GRUB, write grub.cfg
        run: |
          rm -f rootfs.tar.zst
          ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP}p2")
          ESP_UUID=$(sudo blkid -s UUID -o value "${LOOP}p1")
          ROOT_PARTUUID=$(sudo blkid -s PARTUUID -o value "${LOOP}p2")
          printf 'UUID=%s / ext4 defaults 0 1\nUUID=%s /efi vfat umask=0077 0 2\n' "$ROOT_UUID" "$ESP_UUID" | sudo tee /mnt/gentoo/etc/fstab
          sudo mount --rbind /dev /mnt/gentoo/dev
          sudo mount --types proc /proc /mnt/gentoo/proc
          sudo mount --rbind /sys /mnt/gentoo/sys
          sudo chroot /mnt/gentoo /bin/bash -c "grub-install --target=x86_64-efi --efi-directory=/efi --boot-directory=/boot --removable --no-nvram"
          sudo umount -R /mnt/gentoo/dev /mnt/gentoo/proc /mnt/gentoo/sys || sudo umount -l -R /mnt/gentoo/dev /mnt/gentoo/proc /mnt/gentoo/sys || true
          {
            echo 'set timeout=1'
            echo 'menuentry "Gentoo (HP custom kernel)" {'
            echo "  search --no-floppy --fs-uuid --set=root $ROOT_UUID"
            echo "  linux /boot/vmlinuz root=PARTUUID=$ROOT_PARTUUID ro console=tty0 console=ttyS0,115200"
            echo '}'
          } | sudo tee /mnt/gentoo/boot/grub/grub.cfg > /dev/null

      # not in the saved rootfs: a test user with autologin and a check that waits for the MATE panel
      - name: Add CI-only test user, autologin and desktop check
        run: |
          sudo chroot /mnt/gentoo /bin/bash -c "
            set -e
            groupadd -f autologin
            useradd -m -G video,audio,input,autologin ci
          "
          sudo mkdir -p /mnt/gentoo/etc/lightdm/lightdm.conf.d
          printf '[Seat:*]\nautologin-user=ci\nautologin-session=mate\n' | sudo tee /mnt/gentoo/etc/lightdm/lightdm.conf.d/50-ci-autologin.conf
          sudo tee /mnt/gentoo/usr/local/bin/ci-check.sh > /dev/null << 'SH_EOF'
          #!/bin/sh
          for i in $(seq 1 600); do
            pgrep -u ci -x mate-panel > /dev/null && break
            sleep 1
          done
          sleep 25
          echo "display-manager: $(systemctl is-active display-manager.service)"
          echo "ci processes: $(ps -u ci -o comm= | sort -u | tr '\n' ' ')"
          echo "--- Xorg.0.log (errors, driver)"
          grep -E '\(EE\)|modeset|glamor|DRI|LoadModule' /var/log/Xorg.0.log | head -n 40
          if pgrep -u ci -x mate-panel > /dev/null && pgrep -x Xorg > /dev/null; then
            echo CI11-MATE-OK
          else
            journalctl -b -u display-manager.service --no-pager | tail -n 40
            tail -n 40 /var/log/lightdm/lightdm.log
            echo CI11-MATE-FAIL
          fi
          SH_EOF
          sudo chmod +x /mnt/gentoo/usr/local/bin/ci-check.sh
          sudo tee /mnt/gentoo/etc/systemd/system/ci-check.service > /dev/null << 'UNIT_EOF'
          [Unit]
          Description=CI check (Test 11, MATE desktop)
          After=display-manager.service

          [Service]
          Type=oneshot
          TimeoutStartSec=900
          StandardOutput=journal+console
          StandardError=journal+console
          ExecStart=/bin/sh /usr/local/bin/ci-check.sh

          [Install]
          WantedBy=graphical.target
          UNIT_EOF
          sudo systemctl --root=/mnt/gentoo enable ci-check.service

      - name: Unmount and detach image
        run: |
          sync
          sudo umount -R /mnt/gentoo || sudo umount -l -R /mnt/gentoo
          sudo losetup -d "$LOOP"

      - name: Enable KVM if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "ACCEL=-accel kvm -cpu host" >> "$GITHUB_ENV"
          else
            echo "ACCEL=-accel tcg" >> "$GITHUB_ENV"
          fi

      - name: Boot image in QEMU (UEFI, virtio-gpu), wait for MATE, take screenshots
        run: |
          CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          VARS_SRC=/usr/share/OVMF/OVMF_VARS_4M.fd
          cp "$VARS_SRC" /tmp/OVMF_VARS.fd
          shot() { echo "screendump $PWD/shots/$1.png -f png" | socat - UNIX-CONNECT:/tmp/qmon > /dev/null 2>&1 || true; }

          : > boot.log
          # shellcheck disable=SC2086
          qemu-system-x86_64 $ACCEL \
            -machine q35 \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -m 4096 -smp 4 \
            -device ich9-ahci,id=ahci \
            -drive file=disk.img,format=raw,if=none,id=d0 \
            -device ide-hd,drive=d0,bus=ahci.0 \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -device virtio-vga \
            -device qemu-xhci -device usb-tablet -device usb-kbd \
            -display none -serial file:boot.log -monitor unix:/tmp/qmon,server,nowait -no-reboot &
          QPID=$!

          for i in $(seq 1 1200); do
            grep -qE 'CI11-MATE-(OK|FAIL)' boot.log && break
            kill -0 "$QPID" 2>/dev/null || break
            [ "$i" = 120 ] && shot 01-boot-2min
            sleep 1
          done
          sleep 3
          shot 02-desktop
          kill "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true

          echo "----- boot.log (tail) -----"
          tail -n 150 boot.log
          echo "-----"
          ls -l shots/
          if grep -q 'CI11-MATE-OK' boot.log; then
            echo "✅ MATE desktop is up (Xorg + LightDM autologin + mate-panel)"
          else
            echo "❌ MATE did not come up - see log and screenshots"
            exit 1
          fi

      - name: Upload screenshots and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mate-screenshots
          path: |
            shots/
            boot.log
          retention-days: 14
          if-no-files-found: ignore
