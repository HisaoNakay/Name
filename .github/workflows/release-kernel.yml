name: Release - add a kernel (Test 6 artifact) to an existing rootfs release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the successful Test 6 run (kernel-hp-custom)'
        required: true
        default: '42414397105'
      tag:
        description: 'Release tag to attach the kernel to'
        required: true
        default: 'rootfs-2026-11-07'

permissions:
  contents: write
  actions: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-hp-custom
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kernel

      # same layout as the artifact: bzImage, config-hp, System.map, lib/modules/<version>
      - name: Pack kernel as tar.zst
        run: |
          ls kernel kernel/lib/modules
          for o in TUN FUSE_FS EXFAT_FS VETH OVERLAY_FS DRM_SIMPLEDRM; do
            grep -E "^CONFIG_$o=y" kernel/config-hp || { echo "❌ CONFIG_$o missing"; exit 1; }
          done
          tar --numeric-owner --owner=0 --group=0 -I 'zstd -T0 -19' -cf kernel-hp.tar.zst -C kernel .
          sha256sum kernel-hp.tar.zst | tee kernel-hp.tar.zst.sha256
          ls -l kernel-hp.tar.zst

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber kernel-hp.tar.zst kernel-hp.tar.zst.sha256
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[]|"\(.name) \(.size)"'
