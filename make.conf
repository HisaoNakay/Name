# /etc/portage/make.conf — HP (AMD A10-5745M, Piledriver / bdver2)

COMMON_FLAGS="-march=bdver2 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# nproc на раннере GitHub Actions = 4, как и потоков у HP
MAKEOPTS="-j4"

CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3 sse4_1 sse4_2 sse4a aes avx pclmul popcnt abm fma fma4 xop f16c"

USE="systemd -gnome -kde"

# Видео: iGPU HD 8610G (TeraScale 3) -> radeon + r600 в Mesa; dGPU R7 M260 (Topaz, GCN) -> amdgpu + radeonsi
VIDEO_CARDS="-* amdgpu radeonsi radeon r600"
INPUT_DEVICES="libinput"

# Только свободные лицензии; ослабим на Stage 5-6 для прошивок/драйверов AMD
ACCEPT_LICENSE="-* @FREE"

# GRUB только для UEFI (64-бит)
GRUB_PLATFORMS="efi-64"

GENTOO_MIRRORS="https://distfiles.gentoo.org"

EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=4"

# Экономия места и трафика: без man/info/doc, переводы только en и ru.
# Noto: только латиница/кириллица/греческий в основных начертаниях + символы (CJK и эмодзи — отдельные пакеты, их маска не трогает)
INSTALL_MASK="/usr/share/man /usr/share/info /usr/share/doc /usr/share/gtk-doc
  /usr/share/locale -/usr/share/locale/locale.alias
  -/usr/share/locale/en -/usr/share/locale/en_US -/usr/share/locale/en_GB
  -/usr/share/locale/ru -/usr/share/locale/ru_RU
  /usr/share/help -/usr/share/help/C -/usr/share/help/ru -/usr/share/help/en -/usr/share/help/en_GB
  /usr/share/fonts/noto -/usr/share/fonts/noto/fonts.dir -/usr/share/fonts/noto/fonts.scale
  -/usr/share/fonts/noto/NotoSans-Regular.ttf
  -/usr/share/fonts/noto/NotoSans-Bold.ttf
  -/usr/share/fonts/noto/NotoSans-Italic.ttf
  -/usr/share/fonts/noto/NotoSans-BoldItalic.ttf
  -/usr/share/fonts/noto/NotoSans-Medium.ttf
  -/usr/share/fonts/noto/NotoSans-MediumItalic.ttf
  -/usr/share/fonts/noto/NotoSans-Light.ttf
  -/usr/share/fonts/noto/NotoSans-LightItalic.ttf
  -/usr/share/fonts/noto/NotoSerif-Regular.ttf
  -/usr/share/fonts/noto/NotoSerif-Bold.ttf
  -/usr/share/fonts/noto/NotoSerif-Italic.ttf
  -/usr/share/fonts/noto/NotoSerif-BoldItalic.ttf
  -/usr/share/fonts/noto/NotoSansMono-Regular.ttf
  -/usr/share/fonts/noto/NotoSansMono-Bold.ttf
  -/usr/share/fonts/noto/NotoSansSymbols-Regular.ttf
  -/usr/share/fonts/noto/NotoSansSymbols2-Regular.ttf
  -/usr/share/fonts/noto/NotoSansMath-Regular.ttf"
